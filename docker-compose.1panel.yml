# ============================================================
# 1Panel 部署覆盖文件
#
# 1Panel 的「网站」功能已内置 OpenResty 反向代理 + Let's Encrypt 证书，
# 因此这里把服务端口**只绑回环**，由 1Panel 的网站反向代理对外，
# 不再需要额外跑一层 Caddy。
#
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.1panel.yml up -d
#
# ⚠️ 注意 `!override` 标记：compose 对 `ports` 是**合并**语义，
# 若只写新的映射，基础 compose 里的 "8787:8787" 仍会生效并把服务暴露到 0.0.0.0。
# 用 !override 明确替换整个 ports 列表（需要 Docker Compose v2.24+）。
# 老版本 compose 不支持 !override 时，改为只启动本文件：
#   docker compose -f docker-compose.1panel.yml up -d
#
# 对外访问配置（1Panel 面板里做）：
#   网站 → 创建网站 → 反向代理
#     主域名：cost.example.com（DNS 解析到本机）
#     代理地址：http://127.0.0.1:8787
#     开启 HTTPS（申请 Let's Encrypt 证书）
#
# 防火墙：只放行 80/443，**不要**放行 8787。
# ============================================================
services:
  dsh-cost-cloud:
    # 只跑单个容器时，本文件即可独立使用（不依赖基础文件的 ports）
    image: dsh-cost-cloud:latest
    build: .
    container_name: dsh-cost-cloud
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /data
      TRUST_PROXY: "1"
    volumes:
      - dsh_data:/data
    ports: !override
      - "127.0.0.1:8787:8787"

volumes:
  dsh_data:
    name: dsh_data
